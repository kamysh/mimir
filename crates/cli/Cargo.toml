[package]
name = "mimir"
version = "2.0.0"
edition = "2021"

[[bin]]
name = "mimir"
path = "src/main.rs"

[dependencies]
mimir-core = { path = "../core" }
mimir-notifications = { path = "../notifications" }
anyhow = "1.0.104"
tokio = { version = "1.53.3", features = ["full"] }
clap = { version = "4.6.7", features = ["derive"] }
uuid = { version = "1.28.0", features = ["v4"] }
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
toml = "0.8.23"
url = "2.5.8"
libc = "0.2.190"
chrono = "0.4.45"
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
