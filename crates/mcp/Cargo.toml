[package]
name = "mimir-mcp"
version = "2.0.3"
edition = "2021"

[[bin]]
name = "mimir-mcp"
path = "src/main.rs"

[dependencies]
mimir-core = { path = "../core" }
tokio = { version = "1.53.3", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4"] }
