[package]
name = "mimir-core"
version = "0.11.3"
edition = "2021"

[dependencies]
kryzhen = { git = "https://github.com/kamysh/kryzhen", tag = "v0.6.0" }
include_dir = "0.7"
tokio-postgres = { version = "0.7.17", features = ["with-uuid-1", "with-chrono-0_4"] }
native-tls = "0.2.18"
postgres-native-tls = { version = "0.5.3", features = ["runtime"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tract-onnx = "0.21"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
proptest = "1"
