[package]
name = "mimir-eval"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "mimir-eval"
path = "main.rs"

[[bin]]
name = "mimir-learning-compare"
path = "learning_compare.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
