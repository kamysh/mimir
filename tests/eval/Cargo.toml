[package]
name = "mimir-eval"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "mimir-eval"
path = "main.rs"

[[bin]]
name = "mimir-learning-compare"
path = "learning_compare.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "0.8.23"
uuid = { version = "1.28.0", features = ["v4"] }
